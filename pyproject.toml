[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ANYpost"
version = "0.1.3"
description = "Selective engineering result archives and offline recovery"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
dependencies = ["numpy>=1.24", "h5py>=3.8,<4"]

[project.optional-dependencies]
results = ["ANYfeSolver-results>=2.2.0,<3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
